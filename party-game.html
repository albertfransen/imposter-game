<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1040">
    <title>30 Seconden! — Party Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- React + Babel lokaal meegeleverd (lib/), zodat het spel ook zonder internet werkt -->
    <script src="lib/react.production.min.js"></script>
    <script src="lib/react-dom.production.min.js"></script>
    <script src="lib/babel.min.js"></script>

    <!-- Woordenlijsten (apart bestand, makkelijk aan te passen) -->
    <script src="words.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            font-weight: 700;
            background: linear-gradient(160deg, #1a1040 0%, #2d1b69 55%, #512b81 100%);
            color: #fff;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        #root { min-height: 100%; }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
        }

        /* ---------- generieke bouwstenen ---------- */
        .btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 18px;
            font-family: inherit;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            transition: transform .1s, filter .15s;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(.96); filter: brightness(1.15); }
        .btn:disabled { opacity: .4; pointer-events: none; }
        .btn-primary { background: linear-gradient(135deg, #ff5f6d, #ffc371); box-shadow: 0 6px 20px rgba(255,95,109,.45); }
        .btn-green   { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 6px 20px rgba(56,239,125,.35); }
        .btn-ghost   { background: rgba(255,255,255,.12); font-size: 17px; padding: 14px; }

        .card {
            background: rgba(255,255,255,.09);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: .65;
            margin-bottom: 10px;
        }

        .seg {
            display: flex;
            gap: 8px;
        }
        .seg button {
            flex: 1;
            border: 2px solid rgba(255,255,255,.18);
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 17px;
            padding: 12px 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: all .15s;
        }
        .seg button.on {
            background: #ffc371;
            border-color: #ffc371;
            color: #2d1b69;
        }

        /* ---------- setup ---------- */
        .logo {
            text-align: center;
            margin: 14px 0 18px;
        }
        .logo h1 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffc371, #ff5f6d, #c471ed);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.05;
        }
        .logo p { opacity: .7; font-size: 15px; margin-top: 4px; }

        .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .team-dot {
            width: 20px; height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .team-row input {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,.1);
            border: 2px solid rgba(255,255,255,.15);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 18px;
            padding: 12px 14px;
            -webkit-user-select: text;
            user-select: text;
        }
        .team-row input:focus { outline: none; border-color: #ffc371; }
        .team-remove {
            background: rgba(255,255,255,.1);
            border: none;
            color: #ff8a9b;
            font-size: 22px;
            font-weight: 900;
            width: 44px; height: 44px;
            border-radius: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cat-tile {
            border: 2px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all .15s;
        }
        .cat-tile.on {
            border-color: #38ef7d;
            background: rgba(56,239,125,.15);
        }
        .cat-tile .emoji { font-size: 30px; }
        .cat-tile .name { font-size: 15px; font-weight: 900; margin-top: 4px; }
        .cat-tile .count { font-size: 12px; opacity: .6; }
        .cat-tile .check {
            position: absolute;
        }

        /* ---------- scoreboard ---------- */
        .scoreboard {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .score-chip {
            flex: 1;
            border-radius: 14px;
            padding: 8px 6px;
            text-align: center;
            background: rgba(255,255,255,.08);
            border: 2px solid transparent;
            transition: all .3s;
            min-width: 0;
        }
        .score-chip.active {
            border-color: #ffc371;
            background: rgba(255,195,113,.15);
        }
        .score-chip .t-name {
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .score-chip .t-score { font-size: 24px; font-weight: 900; line-height: 1.1; }

        /* ---------- pass screen ---------- */
        .pass-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            animation: popIn .35s ease;
        }
        .pass-screen .phone-emoji { font-size: 72px; animation: wiggle 1.2s ease-in-out infinite; }
        .pass-screen h2 { font-size: 20px; opacity: .75; margin-top: 18px; }
        .pass-screen .team-name {
            font-size: 44px;
            font-weight: 900;
            margin: 6px 0 30px;
            line-height: 1.1;
        }

        /* ---------- turn / words ---------- */
        .timer {
            text-align: center;
            font-size: 76px;
            font-weight: 900;
            line-height: 1;
            margin: 6px 0 14px;
            font-variant-numeric: tabular-nums;
            transition: color .3s;
        }
        .timer.warn { color: #ff5f6d; animation: pulseBig .5s ease-in-out infinite; }
        .timer-static { color: rgba(255,255,255,.5); font-size: 54px; }

        .word-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,.1);
            border: 2px solid rgba(255,255,255,.14);
            border-radius: 18px;
            padding: 16px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all .18s;
            animation: slideIn .3s ease backwards;
        }
        .word-card:nth-child(1) { animation-delay: .02s }
        .word-card:nth-child(2) { animation-delay: .07s }
        .word-card:nth-child(3) { animation-delay: .12s }
        .word-card:nth-child(4) { animation-delay: .17s }
        .word-card:nth-child(5) { animation-delay: .22s }
        .word-card:active { transform: scale(.97); }
        .word-card.guessed {
            background: rgba(56,239,125,.2);
            border-color: #38ef7d;
        }
        .word-card.guessed .word-text {
            text-decoration: line-through;
            opacity: .75;
        }
        .word-check {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            transition: all .18s;
        }
        .word-card.guessed .word-check {
            background: #38ef7d;
            border-color: #38ef7d;
            color: #14352a;
        }
        .word-text {
            flex: 1;
            font-size: 21px;
            font-weight: 900;
            line-height: 1.2;
            min-width: 0;
        }
        .swap-btn {
            background: rgba(255,255,255,.14);
            border: none;
            color: #ffc371;
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .swap-info { text-align: center; font-size: 14px; opacity: .6; margin: 4px 0 12px; }

        /* ---------- result ---------- */
        .result-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; animation: popIn .35s ease; }
        .result-points {
            font-size: 84px;
            font-weight: 900;
            background: linear-gradient(90deg, #38ef7d, #ffc371);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .result-words { text-align: left; margin: 22px 0; }
        .result-word {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,.07);
            margin-bottom: 7px;
            font-size: 17px;
        }
        .result-word.hit { color: #7dffb0; }
        .result-word.miss { opacity: .55; }

        /* ---------- winner ---------- */
        .winner-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        .winner-screen .trophy { font-size: 90px; animation: bounce 1s ease-in-out infinite; }
        .winner-screen h2 { font-size: 22px; opacity: .8; margin-top: 12px; }
        .winner-screen .team-name { font-size: 46px; font-weight: 900; margin: 4px 0 24px; line-height: 1.1; }
        .final-scores { margin-bottom: 26px; }
        .final-row {
            display: flex; justify-content: space-between;
            background: rgba(255,255,255,.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 18px; font-weight: 800;
        }

        .confetti-piece {
            position: fixed;
            top: -20px;
            width: 10px; height: 16px;
            border-radius: 3px;
            animation: confettiFall linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        .round-badge {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: .55;
            margin-bottom: 8px;
        }

        /* ---------- animaties ---------- */
        @keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
        @keyframes pulseBig { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes confettiFall {
            0%   { transform: translateY(-5vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: .7; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

// ================= constants =================
const WORDS_PER_TURN = 5;
const TEAM_COLORS = ['#ff5f6d', '#38ef7d', '#4fc3f7', '#ffc371'];
const DIFF_LABELS = { easy: 'Makkelijk', medium: 'Gemiddeld', hard: 'Moeilijk' };
const STORAGE_KEY = 'party-game-30s';

const DEFAULT_SETTINGS = {
    timer: 30,          // seconden per beurt
    target: 30,         // punten om te winnen
    swaps: 1,           // wissels per beurt
    cats: Object.keys(window.WORD_DATA),
    diffs: ['easy', 'medium', 'hard'],
    sound: true,
};

// ================= geluid (WebAudio, geen bestanden nodig) =================
let audioCtx = null;
function getCtx() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function beep(freq, dur, type, vol, delay) {
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
}
const sfx = {
    tick:   () => beep(950, 0.05, 'square', 0.05),
    ding:   () => { beep(880, 0.12, 'sine', 0.2); beep(1320, 0.18, 'sine', 0.15, 0.09); },
    swap:   () => beep(500, 0.09, 'triangle', 0.15),
    buzzer: () => { beep(170, 0.5, 'sawtooth', 0.22); beep(120, 0.55, 'sawtooth', 0.18, 0.05); },
    win:    () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.25, 'triangle', 0.18, i * 0.14)),
};
function vibrate(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

// ================= woorden helpers =================
function fullPool(settings) {
    const out = new Set();
    settings.cats.forEach(c => {
        const cat = window.WORD_DATA[c];
        if (!cat) return;
        settings.diffs.forEach(d => (cat.words[d] || []).forEach(w => out.add(w)));
    });
    return [...out];
}
function catCount(catKey, diffs) {
    const cat = window.WORD_DATA[catKey];
    return diffs.reduce((n, d) => n + (cat.words[d] || []).length, 0);
}
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ================= opslag =================
function saveGame(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadGame() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || !Array.isArray(s.teams) || s.teams.length < 2) return null;
        return s;
    } catch (e) { return null; }
}
function clearGame() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// ================= kleine componenten =================
function Scoreboard({ teams, current, target }) {
    return (
        <div>
            <div className="scoreboard">
                {teams.map((t, i) => (
                    <div key={i} className={'score-chip' + (i === current ? ' active' : '')}>
                        <div className="t-name" style={{ color: TEAM_COLORS[i] }}>{t.name}</div>
                        <div className="t-score">{t.score}</div>
                    </div>
                ))}
            </div>
            <div className="round-badge">Eerste team met {target} punten wint</div>
        </div>
    );
}

function Confetti() {
    const pieces = useRef(null);
    if (!pieces.current) {
        const colors = ['#ff5f6d', '#ffc371', '#38ef7d', '#4fc3f7', '#c471ed', '#fff176'];
        pieces.current = Array.from({ length: 110 }, (_, i) => ({
            left: Math.random() * 100,
            delay: Math.random() * 3,
            dur: 2.5 + Math.random() * 3,
            color: colors[i % colors.length],
            w: 6 + Math.random() * 8,
        }));
    }
    return (
        <div>
            {pieces.current.map((p, i) => (
                <div key={i} className="confetti-piece" style={{
                    left: p.left + 'vw',
                    background: p.color,
                    width: p.w + 'px',
                    animationDuration: p.dur + 's',
                    animationDelay: p.delay + 's',
                }} />
            ))}
        </div>
    );
}

// ================= hoofdapp =================
function App() {
    // scherm: setup | pass | preview | playing | result | winner
    const [screen, setScreen] = useState('setup');
    const [teams, setTeams] = useState([
        { name: 'Team 1', score: 0 },
        { name: 'Team 2', score: 0 },
    ]);
    const [settings, setSettings] = useState(DEFAULT_SETTINGS);
    const [current, setCurrent] = useState(0);
    const [round, setRound] = useState(1);
    const [used, setUsed] = useState([]);
    const [turnWords, setTurnWords] = useState([]);   // [{text, guessed}]
    const [swapsLeft, setSwapsLeft] = useState(0);
    const [timeLeft, setTimeLeft] = useState(0);
    const [winner, setWinner] = useState(null);
    const [savedGame, setSavedGame] = useState(null);
    const finishingRef = useRef(false); // blokkeert taps zodra de beurt afloopt
    const scoredRef = useRef(false);    // zorgt dat punten maar één keer geteld worden
    const wakeLockRef = useRef(null);

    // ---- opgeslagen spel detecteren bij opstarten ----
    useEffect(() => {
        const s = loadGame();
        if (s && s.inProgress) setSavedGame(s);
    }, []);

    // ---- spel opslaan bij elke relevante wijziging ----
    useEffect(() => {
        if (screen === 'setup') return;
        if (screen === 'winner') { clearGame(); return; }
        saveGame({ inProgress: true, teams, settings, current, round, used });
    }, [screen, teams, settings, current, round, used]);

    // ---- scherm-wakker houden tijdens het spelen ----
    useEffect(() => {
        if (screen === 'playing' && navigator.wakeLock) {
            navigator.wakeLock.request('screen')
                .then(l => { wakeLockRef.current = l; })
                .catch(() => {});
        }
        return () => {
            if (wakeLockRef.current) { wakeLockRef.current.release().catch(() => {}); wakeLockRef.current = null; }
        };
    }, [screen]);

    // ---- timer ----
    useEffect(() => {
        if (screen !== 'playing') return;
        if (timeLeft <= 0) { finishTurn(); return; }
        const id = setTimeout(() => {
            const next = timeLeft - 1;
            if (next > 0 && next <= 10 && settings.sound) sfx.tick();
            setTimeLeft(next);
        }, 1000);
        return () => clearTimeout(id);
    }, [screen, timeLeft]);

    // ---- beurt starten: 5 woorden trekken ----
    function drawTurn() {
        const pool = fullPool(settings);
        let usedNow = used;
        let avail = pool.filter(w => !used.includes(w));
        if (avail.length < WORDS_PER_TURN) {
            // alle woorden gehad → pot resetten
            usedNow = [];
            avail = pool;
        }
        const picked = shuffle(avail).slice(0, WORDS_PER_TURN);
        setUsed([...usedNow, ...picked]);
        setTurnWords(picked.map(w => ({ text: w, guessed: false })));
        setSwapsLeft(settings.swaps);
        setTimeLeft(settings.timer);
        finishingRef.current = false;
        scoredRef.current = false;
    }

    function swapWord(idx) {
        if (swapsLeft <= 0) return;
        const pool = fullPool(settings);
        const inTurn = turnWords.map(w => w.text);
        let avail = pool.filter(w => !used.includes(w) && !inTurn.includes(w));
        if (avail.length === 0) avail = pool.filter(w => !inTurn.includes(w));
        if (avail.length === 0) return;
        const fresh = avail[Math.floor(Math.random() * avail.length)];
        setUsed(u => [...u, fresh]);
        setTurnWords(ws => ws.map((w, i) => i === idx ? { text: fresh, guessed: false } : w));
        setSwapsLeft(s => s - 1);
        if (settings.sound) sfx.swap();
        vibrate(20);
    }

    function toggleWord(idx) {
        if (screen !== 'playing' || finishingRef.current) return;
        const next = turnWords.map((w, i) => i === idx ? { ...w, guessed: !w.guessed } : w);
        setTurnWords(next);
        if (!turnWords[idx].guessed) {
            if (settings.sound) sfx.ding();
            vibrate(35);
            if (next.every(w => w.guessed)) {
                // alles geraden → beurt is meteen klaar
                finishingRef.current = true;
                setTimeout(() => finishTurn(next), 450);
            }
        }
    }

    function finishTurn(wordsOverride) {
        if (scoredRef.current) return;
        scoredRef.current = true;
        finishingRef.current = true;
        const words = wordsOverride || turnWords;
        const points = words.filter(w => w.guessed).length;
        if (settings.sound) {
            if (points === WORDS_PER_TURN) sfx.win(); else sfx.buzzer();
        }
        vibrate([120, 60, 120]);
        setTeams(ts => ts.map((t, i) => i === current ? { ...t, score: t.score + points } : t));
        setScreen('result');
    }

    function nextTurn() {
        const nextIdx = (current + 1) % teams.length;
        if (nextIdx === 0) {
            // ronde compleet → check winnaar (iedereen heeft evenveel beurten gehad)
            const top = Math.max(...teams.map(t => t.score));
            const leaders = teams.filter(t => t.score === top);
            if (top >= settings.target && leaders.length === 1) {
                setWinner(leaders[0]);
                setScreen('winner');
                if (settings.sound) sfx.win();
                vibrate([80, 40, 80, 40, 200]);
                return;
            }
            setRound(r => r + 1);
        }
        setCurrent(nextIdx);
        setScreen('pass');
    }

    // ---- setup handlers ----
    function startGame() {
        if (getCtx()) {} // audio unlocken op user-gesture
        setTeams(ts => ts.map(t => ({ ...t, score: 0 })));
        setCurrent(0);
        setRound(1);
        setUsed([]);
        setWinner(null);
        clearGame();
        setSavedGame(null);
        setScreen('pass');
    }

    function resumeGame() {
        const s = savedGame;
        if (!s) return;
        setTeams(s.teams);
        setSettings({ ...DEFAULT_SETTINGS, ...s.settings });
        setCurrent(s.current || 0);
        setRound(s.round || 1);
        setUsed(s.used || []);
        setSavedGame(null);
        setScreen('pass');
    }

    function backToSetup() {
        clearGame();
        setSavedGame(null);
        setScreen('setup');
    }

    function playAgain() {
        // zelfde teams & instellingen, scores op nul
        setTeams(ts => ts.map(t => ({ ...t, score: 0 })));
        setCurrent(0);
        setRound(1);
        setUsed([]);
        setWinner(null);
        setScreen('pass');
    }

    // ================= schermen =================

    if (screen === 'setup') {
        const setS = patch => setSettings(s => ({ ...s, ...patch }));
        const toggleCat = c => setS({
            cats: settings.cats.includes(c)
                ? settings.cats.filter(x => x !== c)
                : [...settings.cats, c],
        });
        const toggleDiff = d => {
            const next = settings.diffs.includes(d)
                ? settings.diffs.filter(x => x !== d)
                : [...settings.diffs, d];
            if (next.length > 0) setS({ diffs: next });
        };
        const poolSize = fullPool(settings).length;
        const canStart = settings.cats.length > 0 && poolSize >= WORDS_PER_TURN;

        return (
            <div className="app">
                <div className="logo">
                    <h1>30 SECONDEN!</h1>
                    <p>Omschrijf, gok & win 🎉</p>
                </div>

                {savedGame && (
                    <button className="btn btn-green" style={{ marginBottom: 14 }} onClick={resumeGame}>
                        ▶ Verder met vorig spel
                    </button>
                )}

                <div className="card">
                    <div className="section-title">Teams ({teams.length})</div>
                    {teams.map((t, i) => (
                        <div className="team-row" key={i}>
                            <div className="team-dot" style={{ background: TEAM_COLORS[i] }} />
                            <input
                                value={t.name}
                                maxLength={16}
                                onChange={e => setTeams(ts => ts.map((x, j) => j === i ? { ...x, name: e.target.value } : x))}
                            />
                            {teams.length > 2 && (
                                <button className="team-remove" onClick={() => setTeams(ts => ts.filter((_, j) => j !== i))}>×</button>
                            )}
                        </div>
                    ))}
                    {teams.length < 4 && (
                        <button className="btn btn-ghost" onClick={() =>
                            setTeams(ts => [...ts, { name: 'Team ' + (ts.length + 1), score: 0 }])
                        }>+ Team toevoegen</button>
                    )}
                </div>

                <div className="card">
                    <div className="section-title">Categorieën</div>
                    <div className="cat-grid">
                        {Object.keys(window.WORD_DATA).map(c => {
                            const cat = window.WORD_DATA[c];
                            const on = settings.cats.includes(c);
                            return (
                                <div key={c} className={'cat-tile' + (on ? ' on' : '')} onClick={() => toggleCat(c)}>
                                    <div className="emoji">{cat.emoji}</div>
                                    <div className="name">{cat.name}</div>
                                    <div className="count">{catCount(c, settings.diffs)} woorden {on ? '✓' : ''}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>

                <div className="card">
                    <div className="section-title">Moeilijkheid</div>
                    <div className="seg">
                        {['easy', 'medium', 'hard'].map(d => (
                            <button key={d} className={settings.diffs.includes(d) ? 'on' : ''} onClick={() => toggleDiff(d)}>
                                {DIFF_LABELS[d]}
                            </button>
                        ))}
                    </div>
                </div>

                <div className="card">
                    <div className="section-title">Tijd per beurt</div>
                    <div className="seg">
                        {[20, 30, 45, 60].map(t => (
                            <button key={t} className={settings.timer === t ? 'on' : ''} onClick={() => setS({ timer: t })}>{t}s</button>
                        ))}
                    </div>
                </div>

                <div className="card">
                    <div className="section-title">Punten om te winnen</div>
                    <div className="seg">
                        {[20, 30, 40, 50].map(p => (
                            <button key={p} className={settings.target === p ? 'on' : ''} onClick={() => setS({ target: p })}>{p}</button>
                        ))}
                    </div>
                </div>

                <div className="card">
                    <div className="section-title">Wissels per beurt</div>
                    <div className="seg">
                        {[0, 1, 2].map(s => (
                            <button key={s} className={settings.swaps === s ? 'on' : ''} onClick={() => setS({ swaps: s })}>{s}</button>
                        ))}
                    </div>
                </div>

                <div className="card">
                    <div className="seg">
                        <button className={settings.sound ? 'on' : ''} onClick={() => setS({ sound: true })}>🔊 Geluid aan</button>
                        <button className={!settings.sound ? 'on' : ''} onClick={() => setS({ sound: false })}>🔇 Uit</button>
                    </div>
                </div>

                <button className="btn btn-primary" disabled={!canStart} onClick={startGame}>
                    START HET SPEL 🚀
                </button>
                {!canStart && <p style={{ textAlign: 'center', marginTop: 10, opacity: .6, fontSize: 14 }}>Kies minstens één categorie</p>}
            </div>
        );
    }

    if (screen === 'pass') {
        const team = teams[current];
        return (
            <div className="app">
                <Scoreboard teams={teams} current={current} target={settings.target} />
                <div className="pass-screen">
                    <div className="phone-emoji">📱</div>
                    <h2>Ronde {round} — geef de telefoon aan</h2>
                    <div className="team-name" style={{ color: TEAM_COLORS[current] }}>{team.name}</div>
                    <button className="btn btn-primary" onClick={() => { drawTurn(); setScreen('preview'); }}>
                        Ik ga omschrijven — toon woorden
                    </button>
                    <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={backToSetup}>
                        Stop spel
                    </button>
                </div>
            </div>
        );
    }

    if (screen === 'preview') {
        return (
            <div className="app">
                <Scoreboard teams={teams} current={current} target={settings.target} />
                <div className="timer timer-static">{settings.timer}</div>
                {turnWords.map((w, i) => (
                    <div className="word-card" key={w.text}>
                        <div className="word-text">{w.text}</div>
                        {swapsLeft > 0 && (
                            <button className="swap-btn" onClick={() => swapWord(i)}>🔄 wissel</button>
                        )}
                    </div>
                ))}
                <div className="swap-info">
                    {settings.swaps > 0 ? `Nog ${swapsLeft} wissel${swapsLeft === 1 ? '' : 's'} — alleen vóór de start` : 'Geen wissels ingesteld'}
                </div>
                <button className="btn btn-green" onClick={() => { getCtx(); setScreen('playing'); }}>
                    ▶ START ({settings.timer} sec)
                </button>
            </div>
        );
    }

    if (screen === 'playing') {
        return (
            <div className="app">
                <Scoreboard teams={teams} current={current} target={settings.target} />
                <div className={'timer' + (timeLeft <= 10 ? ' warn' : '')}>{timeLeft}</div>
                {turnWords.map((w, i) => (
                    <div
                        className={'word-card' + (w.guessed ? ' guessed' : '')}
                        key={w.text}
                        onClick={() => toggleWord(i)}
                    >
                        <div className="word-check">{w.guessed ? '✓' : ''}</div>
                        <div className="word-text">{w.text}</div>
                    </div>
                ))}
                <div className="swap-info">Tik een woord aan als het geraden is</div>
            </div>
        );
    }

    if (screen === 'result') {
        const points = turnWords.filter(w => w.guessed).length;
        return (
            <div className="app">
                <Scoreboard teams={teams} current={current} target={settings.target} />
                <div className="result-screen">
                    <div style={{ fontSize: 40 }}>{points === WORDS_PER_TURN ? '🔥' : points >= 3 ? '👏' : '⏰'}</div>
                    <div className="result-points">+{points}</div>
                    <div style={{ opacity: .7, fontSize: 17 }}>
                        punten voor <b style={{ color: TEAM_COLORS[current] }}>{teams[current].name}</b>
                    </div>
                    <div className="result-words">
                        {turnWords.map(w => (
                            <div key={w.text} className={'result-word ' + (w.guessed ? 'hit' : 'miss')}>
                                <span>{w.text}</span>
                                <span>{w.guessed ? '✓' : '✗'}</span>
                            </div>
                        ))}
                    </div>
                    <button className="btn btn-primary" onClick={nextTurn}>Volgende beurt →</button>
                </div>
            </div>
        );
    }

    if (screen === 'winner') {
        return (
            <div className="app">
                <Confetti />
                <div className="winner-screen">
                    <div className="trophy">🏆</div>
                    <h2>De winnaar is</h2>
                    <div className="team-name" style={{ color: TEAM_COLORS[teams.indexOf(winner)] }}>
                        {winner ? winner.name : ''}
                    </div>
                    <div className="final-scores">
                        {teams.slice().sort((a, b) => b.score - a.score).map((t, i) => (
                            <div className="final-row" key={t.name + i}>
                                <span>{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '4️⃣'} {t.name}</span>
                                <span>{t.score}</span>
                            </div>
                        ))}
                    </div>
                    <button className="btn btn-primary" onClick={playAgain}>🔁 Nog een potje</button>
                    <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={backToSetup}>Naar instellingen</button>
                </div>
            </div>
        );
    }

    return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
